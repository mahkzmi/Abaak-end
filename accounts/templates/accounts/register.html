<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - آباک</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .role-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-card:hover {
            border-color: #2e7d32;
        }
        .role-card.selected {
            border-color: #2e7d32;
            background: #f0fdf4;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
        }
        .role-card input[type="radio"] {
            display: none;
        }
        .role-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .role-name {
            font-weight: 600;
            color: #1f2937;
        }
        .role-desc {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <div class="flex items-center justify-center">
                <i class="bi bi-tree-fill text-3xl text-green-700"></i>
                <span class="text-2xl font-bold text-green-700 mr-2">آباک</span>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mt-4">ثبت‌نام در آباک</h2>
            <p class="text-gray-600 text-sm">نقش خود را انتخاب کنید</p>
        </div>

        <!-- انتخاب نقش -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <label class="role-card" data-role="FARMER">
                <input type="radio" name="role" value="FARMER" checked>
                <span class="role-icon">🌾</span>
                <div class="role-name">کشاورز</div>
                <div class="role-desc">مدیریت مزارع و تحلیل خاک</div>
            </label>
            <label class="role-card" data-role="EXPERT">
                <input type="radio" name="role" value="EXPERT">
                <span class="role-icon">👨‍🔬</span>
                <div class="role-name">کارشناس</div>
                <div class="role-desc">تأیید نمونه و مشاوره</div>
            </label>
            <label class="role-card" data-role="LAB">
                <input type="radio" name="role" value="LAB">
                <span class="role-icon">🧪</span>
                <div class="role-name">آزمایشگاه</div>
                <div class="role-desc">ثبت نمونه‌های خاک</div>
            </label>
            <label class="role-card" data-role="CRM">
                <input type="radio" name="role" value="CRM">
                <span class="role-icon">📞</span>
                <div class="role-name">پشتیبانی (CRM)</div>
                <div class="role-desc">مدیریت درخواست‌ها</div>
            </label>
            <label class="role-card col-span-2" data-role="ADMIN">
                <input type="radio" name="role" value="ADMIN">
                <span class="role-icon">👑</span>
                <div class="role-name">مدیر سیستم</div>
                <div class="role-desc">دسترسی کامل به همه بخش‌ها</div>
            </label>
        </div>

        <!-- فرم ثبت‌نام -->
        <form id="register-form" class="space-y-3">
            <input type="hidden" id="role-input" value="FARMER">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">نام کاربری *</label>
                <input type="text" id="username" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ایمیل</label>
                <input type="email" id="email" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">نام</label>
                <input type="text" id="first_name" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">نام خانوادگی</label>
                <input type="text" id="last_name" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">شماره موبایل *</label>
                <input type="text" id="phone" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="۰۹۱۲۳۴۵۶۷۸۹">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">کد ملی *</label>
                <input type="text" id="national_id" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رمز عبور *</label>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">تکرار رمز عبور *</label>
                <input type="password" id="password2" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-medium">
                <i class="bi bi-person-plus ml-1"></i> ثبت‌نام
            </button>
        </form>

        <div id="message" class="mt-4 hidden"></div>

        <p class="text-center text-sm text-gray-600 mt-6">
            قبلاً ثبت‌نام کرده‌اید؟
            <a href="/login/" class="text-green-600 hover:underline">وارد شوید</a>
        </p>
    </div>

    <script>
        // ============================================================
        // انتخاب نقش
        // ============================================================
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                const radio = this.querySelector('input[type="radio"]');
                radio.checked = true;
                document.getElementById('role-input').value = radio.value;
            });
        });

        // ============================================================
        // ثبت‌نام
        // ============================================================
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                first_name: document.getElementById('first_name').value.trim(),
                last_name: document.getElementById('last_name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                national_id: document.getElementById('national_id').value.trim(),
                password: document.getElementById('password').value,
                password2: document.getElementById('password2').value,
                role: document.getElementById('role-input').value,
            };

            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    messageDiv.className = 'mt-4 p-3 bg-green-100 text-green-700 rounded-lg';
                    messageDiv.textContent = '✅ ' + result.message;

                    localStorage.setItem('access_token', result.tokens.access);
                    localStorage.setItem('refresh_token', result.tokens.refresh);
                    localStorage.setItem('user_role', data.role);

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    let errorMsg = Object.values(result).flat().join(' | ');
                    messageDiv.className = 'mt-4 p-3 bg-red-100 text-red-700 rounded-lg';
                    messageDiv.textContent = '❌ ' + (errorMsg || 'خطا در ثبت‌نام');
                }
                messageDiv.classList.remove('hidden');

            } catch (error) {
                messageDiv.className = 'mt-4 p-3 bg-red-100 text-red-700 rounded-lg';
                messageDiv.textContent = '❌ خطا: ' + error.message;
                messageDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
