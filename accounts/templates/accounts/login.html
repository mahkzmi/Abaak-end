<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - آباک</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center">
                <i class="bi bi-tree-fill text-3xl text-green-700"></i>
                <span class="text-2xl font-bold text-green-700 mr-2">آباک</span>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mt-4">ورود به آباک</h2>
            <p class="text-gray-600 text-sm">به سامانه هوشمند تحلیل خاک خوش آمدید</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">نام کاربری *</label>
                <input type="text" id="username" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رمز عبور *</label>
                <input type="password" id="password" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>

            <button type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-medium">
                <i class="bi bi-box-arrow-in-right ml-1"></i> ورود
            </button>
        </form>

        <div id="message" class="mt-4 hidden"></div>

        <p class="text-center text-sm text-gray-600 mt-6">
            ثبت‌نام نکرده‌اید؟
            <a href="/register/" class="text-green-600 hover:underline">ثبت‌نام کنید</a>
        </p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
    };

    const messageDiv = document.getElementById('message');

    try {
        const response = await fetch('/api/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            messageDiv.className = 'mt-4 p-3 bg-green-100 text-green-700 rounded-lg';
            messageDiv.textContent = '✅ ورود با موفقیت انجام شد';

            // ذخیره توکن‌ها
            localStorage.setItem('access_token', result.access);
            localStorage.setItem('refresh_token', result.refresh);

            // انتقال به صفحه نقشه (map)
            setTimeout(() => {
                window.location.href = '/map/';  // ← این رو به /map/ تغییر بده
            }, 1000);
        } else {
            messageDiv.className = 'mt-4 p-3 bg-red-100 text-red-700 rounded-lg';
            messageDiv.textContent = '❌ ' + (result.detail || 'نام کاربری یا رمز عبور اشتباه است');
        }
        messageDiv.classList.remove('hidden');

    } catch (error) {
        messageDiv.className = 'mt-4 p-3 bg-red-100 text-red-700 rounded-lg';
        messageDiv.textContent = '❌ خطا: ' + error.message;
        messageDiv.classList.remove('hidden');
    }
});
    </script>
</body>
</html>
